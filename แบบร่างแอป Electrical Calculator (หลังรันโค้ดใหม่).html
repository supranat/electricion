<script>
const PAGES={"home": {"head": "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap\"><style>\n/* ============================================================\n   Electrical Calculator | Neon Amber Terminal (cyberpunk / AI tech)\n   ============================================================ */\n\n:root {\n    --bg: #0a0608;\n    --panel: rgba(30, 16, 18, 0.72);\n    --panel-solid: #1b0f12;\n    --amber: #ff7a1a;\n    --amber-soft: #ffb27a;\n    --amber-dark: #c2410c;\n    --cyan: #22e5ff;\n    --red: #ff2b4a;\n    --ink: #fff1e8;\n    --muted: #d9a98a;\n    --line: rgba(255, 142, 79, 0.32);\n    --radius: 16px;\n    --glow: 0 0 22px rgba(255, 122, 26, 0.35);\n    --font-th: \"Kanit\", \"Sarabun\", \"Noto Sans Thai\", Tahoma, sans-serif;\n    --font-hud: \"Orbitron\", \"Kanit\", sans-serif;\n    --font-mono: \"JetBrains Mono\", ui-monospace, Consolas, monospace;\n    color-scheme: dark;\n}\n\n* {\n    box-sizing: border-box;\n}\n\nhtml {\n    scroll-behavior: smooth;\n}\n\nbody {\n    margin: 0;\n    color: var(--ink);\n    font-family: var(--font-th);\n    line-height: 1.7;\n    background:\n        linear-gradient(rgba(255, 122, 26, 0.045) 1px, transparent 1px),\n        linear-gradient(90deg, rgba(255, 122, 26, 0.045) 1px, transparent 1px),\n        linear-gradient(135deg, #0b0710 0%, #1a0b10 52%, #0a0608 100%);\n    background-size: 38px 38px, 38px 38px, auto;\n    background-attachment: fixed;\n}\n\na {\n    color: inherit;\n    text-decoration: none;\n}\n\na:focus-visible,\n.button:focus-visible {\n    outline: 3px solid var(--cyan);\n    outline-offset: 3px;\n}\n\n/* ---------- เอฟเฟกต์พื้นหลัง (อยู่หลังเนื้อหาทั้งหมด) ---------- */\n\n/* ลูกแสงลอยช้า ๆ */\nhtml::before {\n    content: \"\";\n    position: fixed;\n    inset: -4% -4% -4% -4%;\n    z-index: -1;\n    pointer-events: none;\n    background:\n        radial-gradient(46vw 46vw at 4% 3%, rgba(255, 90, 24, 0.24), transparent 70%),\n        radial-gradient(40vw 40vw at 98% 38%, rgba(34, 229, 255, 0.13), transparent 70%),\n        radial-gradient(44vw 44vw at 6% 96%, rgba(255, 43, 74, 0.13), transparent 70%);\n    animation: drift 26s ease-in-out infinite alternate;\n}\n\n/* แถบสแกนเลื่อนลง */\nhtml::after {\n    content: \"\";\n    position: fixed;\n    left: 0;\n    right: 0;\n    top: 0;\n    height: 150px;\n    z-index: -1;\n    pointer-events: none;\n    background: linear-gradient(180deg, transparent, rgba(255, 122, 26, 0.07), transparent);\n    animation: scan 12s linear infinite;\n}\n\n/* พื้นกริดเปอร์สเปกทีฟด้านล่าง */\nbody::before {\n    content: \"\";\n    position: fixed;\n    left: -60%;\n    right: -60%;\n    bottom: -20px;\n    height: 360px;\n    z-index: -1;\n    pointer-events: none;\n    opacity: 0.5;\n    background:\n        linear-gradient(rgba(255, 122, 26, 0.42) 1px, transparent 1px),\n        linear-gradient(90deg, rgba(255, 122, 26, 0.42) 1px, transparent 1px);\n    background-size: 64px 64px;\n    transform-origin: 50% 100%;\n    transform: perspective(380px) rotateX(64deg);\n    -webkit-mask-image: linear-gradient(to top, #000 8%, transparent 88%);\n    mask-image: linear-gradient(to top, #000 8%, transparent 88%);\n    animation: floor 3.2s linear infinite;\n}\n\n/* อนุภาคลอยขึ้น (ส้มและฟ้า) */\nbody::after {\n    content: \"\";\n    position: fixed;\n    top: 0;\n    left: 0;\n    width: 2px;\n    height: 2px;\n    z-index: -1;\n    pointer-events: none;\n    border-radius: 50%;\n    background: #ff9a54;\n    box-shadow: 58vw 72vh 3px 0 #22e5ff,58vw 172vh 3px 0 #22e5ff,60vw 58vh 3px 0 #ff9a54,60vw 158vh 3px 0 #ff9a54,66vw 76vh 3px 0 #ff9a54,66vw 176vh 3px 0 #ff9a54,25vw 24vh 3px 0 #22e5ff,25vw 124vh 3px 0 #22e5ff,66vw 61vh 3px 0 #ff9a54,66vw 161vh 3px 0 #ff9a54,81vw 79vh 3px 0 #ff9a54,81vw 179vh 3px 0 #ff9a54,24vw 13vh 3px 0 #22e5ff,24vw 113vh 3px 0 #22e5ff,58vw 39vh 3px 0 #ff9a54,58vw 139vh 3px 0 #ff9a54,19vw 12vh 3px 0 #ff9a54,19vw 112vh 3px 0 #ff9a54,69vw 89vh 3px 0 #22e5ff,69vw 189vh 3px 0 #22e5ff,82vw 6vh 3px 0 #ff9a54,82vw 106vh 3px 0 #ff9a54,77vw 51vh 3px 0 #ff9a54,77vw 151vh 3px 0 #ff9a54,58vw 84vh 3px 0 #22e5ff,58vw 184vh 3px 0 #22e5ff,95vw 79vh 3px 0 #ff9a54,95vw 179vh 3px 0 #ff9a54,84vw 21vh 3px 0 #ff9a54,84vw 121vh 3px 0 #ff9a54,80vw 2vh 3px 0 #22e5ff,80vw 102vh 3px 0 #22e5ff,68vw 9vh 3px 0 #ff9a54,68vw 109vh 3px 0 #ff9a54,8vw 5vh 3px 0 #ff9a54,8vw 105vh 3px 0 #ff9a54,25vw 31vh 3px 0 #22e5ff,25vw 131vh 3px 0 #22e5ff,77vw 4vh 3px 0 #ff9a54,77vw 104vh 3px 0 #ff9a54,60vw 42vh 3px 0 #ff9a54,60vw 142vh 3px 0 #ff9a54,57vw 76vh 3px 0 #22e5ff,57vw 176vh 3px 0 #22e5ff,26vw 67vh 3px 0 #ff9a54,26vw 167vh 3px 0 #ff9a54,30vw 82vh 3px 0 #ff9a54,30vw 182vh 3px 0 #ff9a54,38vw 64vh 3px 0 #22e5ff,38vw 164vh 3px 0 #22e5ff,1vw 85vh 3px 0 #ff9a54,1vw 185vh 3px 0 #ff9a54,11vw 59vh 3px 0 #ff9a54,11vw 159vh 3px 0 #ff9a54,84vw 36vh 3px 0 #22e5ff,84vw 136vh 3px 0 #22e5ff,53vw 71vh 3px 0 #ff9a54,53vw 171vh 3px 0 #ff9a54,11vw 91vh 3px 0 #ff9a54,11vw 191vh 3px 0 #ff9a54,33vw 41vh 3px 0 #22e5ff,33vw 141vh 3px 0 #22e5ff,98vw 30vh 3px 0 #ff9a54,98vw 130vh 3px 0 #ff9a54,66vw 37vh 3px 0 #ff9a54,66vw 137vh 3px 0 #ff9a54,4vw 9vh 3px 0 #22e5ff,4vw 109vh 3px 0 #22e5ff,73vw 99vh 3px 0 #ff9a54,73vw 199vh 3px 0 #ff9a54,14vw 52vh 3px 0 #ff9a54,14vw 152vh 3px 0 #ff9a54,14vw 38vh 3px 0 #22e5ff,14vw 138vh 3px 0 #22e5ff,50vw 9vh 3px 0 #ff9a54,50vw 109vh 3px 0 #ff9a54,3vw 88vh 3px 0 #ff9a54,3vw 188vh 3px 0 #ff9a54,1vw 28vh 3px 0 #22e5ff,1vw 128vh 3px 0 #22e5ff,27vw 7vh 3px 0 #ff9a54,27vw 107vh 3px 0 #ff9a54,61vw 49vh 3px 0 #ff9a54,61vw 149vh 3px 0 #ff9a54,91vw 51vh 3px 0 #22e5ff,91vw 151vh 3px 0 #22e5ff,54vw 10vh 3px 0 #ff9a54,54vw 110vh 3px 0 #ff9a54;\n    animation: dots-up 60s linear infinite;\n}\n\n@keyframes drift { to { transform: translate(3vw, 2vw) scale(1.06); } }\n@keyframes scan { from { transform: translateY(-170px); } to { transform: translateY(100vh); } }\n@keyframes floor { to { background-position: 0 64px, 0 0; } }\n@keyframes dots-up { to { transform: translateY(-100vh); } }\n@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }\n@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }\n@keyframes spin { to { transform: rotate(360deg); } }\n@keyframes sweep { to { background-position: 200% 0; } }\n@keyframes flow { to { background-position: 200% 0; } }\n@keyframes glitch {\n    0%   { transform: translate(0); }\n    15%  { transform: translate(-3px, 1px); filter: drop-shadow(3px 0 var(--cyan)) drop-shadow(-3px 0 var(--red)); }\n    30%  { transform: translate(3px, -1px); filter: drop-shadow(-3px 0 var(--cyan)) drop-shadow(3px 0 var(--red)); }\n    45%  { transform: translate(-1px, 0); filter: drop-shadow(2px 0 var(--cyan)); }\n    60%, 100% { transform: translate(0); filter: none; }\n}\n\n/* ---------- ส่วนหัวและเมนู ---------- */\n\nheader {\n    position: sticky;\n    top: 0;\n    z-index: 10;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 24px;\n    padding: 14px max(5%, calc((100% - 1200px) / 2));\n    background: rgba(12, 7, 10, 0.82);\n    box-shadow: 0 6px 28px rgba(0, 0, 0, 0.45);\n    backdrop-filter: blur(12px);\n}\n\nheader::after {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    height: 2px;\n    background: linear-gradient(90deg, transparent, var(--amber), var(--cyan), var(--amber), transparent);\n    background-size: 200% 100%;\n    animation: sweep 6s linear infinite;\n}\n\n.logo {\n    display: inline-flex;\n    align-items: center;\n    color: var(--ink);\n    font-family: var(--font-hud);\n    font-size: 1.05rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    white-space: nowrap;\n}\n\n.logo::before {\n    content: \"AK\";\n    display: inline-grid;\n    place-items: center;\n    width: 40px;\n    height: 40px;\n    margin-right: 12px;\n    border: 1px solid var(--amber-soft);\n    border-radius: 11px;\n    color: var(--amber-soft);\n    font-size: 0.95rem;\n    font-weight: 900;\n    background: var(--panel-solid);\n    box-shadow: 0 0 18px rgba(255, 122, 26, 0.55), inset 0 0 10px rgba(255, 122, 26, 0.25);\n}\n\nnav {\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    justify-content: flex-end;\n    gap: 6px;\n}\n\nnav a {\n    position: relative;\n    padding: 8px 13px;\n    border-radius: 9px;\n    color: #ffc9a3;\n    font-weight: 500;\n    transition: 0.2s ease;\n}\n\nnav a::after {\n    content: \"\";\n    position: absolute;\n    left: 14px;\n    right: 14px;\n    bottom: 3px;\n    height: 2px;\n    background: var(--cyan);\n    box-shadow: 0 0 10px var(--cyan);\n    transform: scaleX(0);\n    transition: transform 0.25s ease;\n}\n\nnav a:hover,\nnav a:focus-visible {\n    color: var(--ink);\n    background: rgba(255, 122, 26, 0.14);\n    box-shadow: 0 0 16px rgba(255, 122, 26, 0.3);\n}\n\nnav a:hover::after,\nnav a:focus-visible::after {\n    transform: scaleX(1);\n}\n\n/* ---------- เนื้อหาหลัก ---------- */\n\nmain {\n    width: min(1120px, 90%);\n    margin: 32px auto 64px;\n}\n\nsection {\n    position: relative;\n    margin: 26px 0;\n    padding: 34px;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: var(--radius);\n    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), inset 0 0 30px rgba(255, 122, 26, 0.04);\n    backdrop-filter: blur(8px);\n    scroll-margin-top: 100px;\n    animation: rise 0.7s ease-out both;\n}\n\nsection:nth-of-type(2) { animation-delay: 0.08s; }\nsection:nth-of-type(3) { animation-delay: 0.16s; }\nsection:nth-of-type(4) { animation-delay: 0.24s; }\nsection:nth-of-type(5) { animation-delay: 0.32s; }\nsection:nth-of-type(6) { animation-delay: 0.4s; }\n\n/* มุมกรอบเรืองแสง */\nsection:not(#home)::before,\nsection:not(#home)::after {\n    content: \"\";\n    position: absolute;\n    width: 26px;\n    height: 26px;\n    pointer-events: none;\n}\n\nsection:not(#home)::before {\n    top: -1px;\n    left: -1px;\n    border-top: 2px solid var(--amber);\n    border-left: 2px solid var(--amber);\n    border-top-left-radius: var(--radius);\n    filter: drop-shadow(0 0 6px var(--amber));\n}\n\nsection:not(#home)::after {\n    right: -1px;\n    bottom: -1px;\n    border-right: 2px solid var(--cyan);\n    border-bottom: 2px solid var(--cyan);\n    border-bottom-right-radius: var(--radius);\n    filter: drop-shadow(0 0 6px var(--cyan));\n}\n\nsection h2 {\n    margin: 0 0 20px;\n    color: var(--ink);\n    font-size: 1.65rem;\n    font-weight: 600;\n    text-shadow: 0 0 18px rgba(255, 122, 26, 0.45);\n}\n\nsection h2::before {\n    content: \"//\";\n    margin-right: 12px;\n    color: var(--cyan);\n    font-family: var(--font-mono);\n    font-weight: 600;\n    text-shadow: 0 0 12px var(--cyan);\n}\n\nsection p {\n    color: var(--muted);\n}\n\n/* ---------- ส่วนต้อนรับ (Hero) ---------- */\n\n#home {\n    min-height: 360px;\n    display: flex;\n    flex-direction: column;\n    justify-content: center;\n    overflow: hidden;\n    border-left: 6px solid var(--amber);\n    background:\n        radial-gradient(ellipse at 90% 8%, rgba(255, 112, 48, 0.3), transparent 40%),\n        linear-gradient(120deg, rgba(43, 18, 20, 0.92), rgba(18, 10, 15, 0.9));\n    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 77, 29, 0.14);\n}\n\n#home::before {\n    content: \"● SYSTEM ONLINE\";\n    position: absolute;\n    top: 22px;\n    right: 24px;\n    padding: 6px 14px;\n    border: 1px solid rgba(34, 229, 255, 0.5);\n    border-radius: 999px;\n    color: var(--cyan);\n    font-family: var(--font-hud);\n    font-size: 0.66rem;\n    font-weight: 700;\n    letter-spacing: 0.16em;\n    background: rgba(34, 229, 255, 0.07);\n    box-shadow: 0 0 16px rgba(34, 229, 255, 0.2);\n    animation: blink 2.4s ease-in-out infinite;\n}\n\n/* วงแหวน HUD หมุน */\n#home::after {\n    content: \"\";\n    position: absolute;\n    right: -90px;\n    bottom: -110px;\n    width: 360px;\n    height: 360px;\n    border: 1px dashed rgba(34, 229, 255, 0.4);\n    border-radius: 50%;\n    background: radial-gradient(circle closest-side, transparent calc(100% - 32px), rgba(255, 122, 26, 0.45) calc(100% - 32px), rgba(255, 122, 26, 0.45) calc(100% - 30px), transparent calc(100% - 30px));\n    box-shadow: inset 0 0 50px rgba(34, 229, 255, 0.1);\n    pointer-events: none;\n    animation: spin 40s linear infinite;\n}\n\n#home h1 {\n    position: relative;\n    max-width: 780px;\n    margin: 0 0 14px;\n    font-size: clamp(2rem, 5vw, 3.5rem);\n    font-weight: 700;\n    line-height: 1.25;\n    color: transparent;\n    background: linear-gradient(90deg, #fff1e8, #ffb27a 45%, #22e5ff 75%, #fff1e8);\n    background-size: 200% 100%;\n    -webkit-background-clip: text;\n    background-clip: text;\n    animation: glitch 0.9s steps(1) 1, flow 9s linear infinite;\n}\n\n#home h1::before {\n    content: \"ELECTRICAL // AI POWER CONSOLE\";\n    display: block;\n    margin-bottom: 10px;\n    color: var(--cyan);\n    -webkit-text-fill-color: var(--cyan);\n    font-family: var(--font-hud);\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.28em;\n    text-shadow: 0 0 10px rgba(34, 229, 255, 0.6);\n}\n\n#home p {\n    max-width: 680px;\n    margin: 0;\n    color: #f0cdb3;\n    font-size: 1.12rem;\n}\n\n#home .button {\n    align-self: flex-start;\n    margin-top: 26px;\n    padding: 14px 26px;\n    font-size: 1.1rem;\n}\n\n/* ---------- การ์ดสินค้าและเครื่องมือ ---------- */\n\n.card-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n    gap: 20px;\n    counter-reset: card;\n}\n\n.card {\n    position: relative;\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n    padding: 24px;\n    background:\n        radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(34, 229, 255, calc(0.16 * var(--spot, 0))), transparent 65%),\n        linear-gradient(145deg, rgba(44, 22, 22, 0.9), rgba(16, 10, 15, 0.92));\n    border: 1px solid var(--line);\n    border-radius: 14px;\n    box-shadow: inset 0 0 24px rgba(255, 122, 26, 0.04);\n    transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));\n    transition: transform 0.15s ease-out, box-shadow 0.25s ease, border-color 0.25s ease;\n    counter-increment: card;\n}\n\n.card::before {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    right: 0;\n    top: 0;\n    height: 2px;\n    background: linear-gradient(90deg, transparent, var(--amber), var(--cyan), transparent);\n    background-size: 200% 100%;\n    animation: sweep 4s linear infinite;\n}\n\n.card::after {\n    content: counter(card, decimal-leading-zero);\n    position: absolute;\n    top: 12px;\n    right: 16px;\n    color: rgba(34, 229, 255, 0.55);\n    font-family: var(--font-mono);\n    font-size: 0.8rem;\n    font-weight: 600;\n    letter-spacing: 0.1em;\n}\n\n.card:hover {\n    --lift: -5px;\n    border-color: rgba(34, 229, 255, 0.55);\n    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 0 26px rgba(34, 229, 255, 0.18);\n}\n\n.card h3 {\n    margin: 0 0 8px;\n    padding-right: 36px;\n    color: var(--ink);\n    font-size: 1.2rem;\n    font-weight: 600;\n}\n\n.card p {\n    flex: 1;\n    margin: 0 0 6px;\n    color: var(--muted);\n}\n\n/* ---------- ปุ่ม ---------- */\n\n.button {\n    position: relative;\n    display: inline-block;\n    overflow: hidden;\n    margin-top: auto;\n    padding: 11px 20px;\n    border: 1px solid rgba(255, 151, 84, 0.6);\n    border-radius: 10px;\n    background: linear-gradient(120deg, #a92c1b, #f05220 58%, #ff9b45);\n    color: #fff4ed;\n    font: inherit;\n    font-weight: 600;\n    letter-spacing: 0.02em;\n    cursor: pointer;\n    box-shadow: 0 0 20px rgba(255, 92, 26, 0.35);\n    transition: transform 0.2s ease, box-shadow 0.2s ease;\n}\n\n.card .button {\n    margin-top: 18px;\n    align-self: flex-start;\n}\n\n.button::before {\n    content: \"\";\n    position: absolute;\n    top: 0;\n    left: -80%;\n    width: 50%;\n    height: 100%;\n    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);\n    transform: skewX(-20deg);\n    transition: left 0.6s ease;\n}\n\n.button::after {\n    content: \" →\";\n    display: inline-block;\n    transition: transform 0.2s ease;\n}\n\n.button:hover {\n    transform: translateY(-3px);\n    box-shadow: 0 12px 30px rgba(255, 92, 26, 0.55), 0 0 26px rgba(255, 154, 84, 0.5);\n}\n\n.button:hover::before {\n    left: 130%;\n}\n\n.button:hover::after {\n    transform: translateX(4px);\n}\n\n/* ---------- ท้ายเว็บ ---------- */\n\nfooter {\n    position: relative;\n    padding: 26px 5%;\n    color: var(--muted);\n    background: rgba(10, 6, 8, 0.88);\n    text-align: center;\n    font-family: var(--font-mono);\n    font-size: 0.85rem;\n    letter-spacing: 0.08em;\n}\n\nfooter::before {\n    content: \"\";\n    position: absolute;\n    left: 0;\n    right: 0;\n    top: 0;\n    height: 2px;\n    background: linear-gradient(90deg, transparent, var(--amber), var(--cyan), var(--amber), transparent);\n    background-size: 200% 100%;\n    animation: sweep 6s linear infinite;\n}\n\nfooter p {\n    margin: 0;\n    color: var(--muted);\n}\n\n/* ---------- เอฟเฟกต์เพิ่มเติม ---------- */\n\n/* แสงตามเมาส์ (สร้างโดยสคริปต์ใน index.html) */\n.cursor-glow {\n    position: fixed;\n    left: 0;\n    top: 0;\n    z-index: 9;\n    width: 440px;\n    height: 440px;\n    margin: -220px 0 0 -220px;\n    border-radius: 50%;\n    pointer-events: none;\n    opacity: 0;\n    mix-blend-mode: screen;\n    background: radial-gradient(circle, rgba(255, 122, 26, 0.16), rgba(34, 229, 255, 0.05) 45%, transparent 70%);\n    transition: opacity 0.4s ease;\n    will-change: transform;\n}\n\n/* คำอธิบายใน Hero ค่อย ๆ พิมพ์ออกมา */\n#home p {\n    animation: type 2.4s steps(40, end) 0.7s both;\n}\n\n@keyframes type {\n    from ลง<\/button><\/div><div id=\"t-out\"><div class=\"tc-card\"><div class=\"tc-term-bar\"><b><\/b><b><\/b><b><\/b>AI ANALYSIS · transformer.sizing<\/div><div class=\"tc-term-body\"><div><span class=\"p\">&gt;<\/span>status <span class=\"v\">awaiting_input<\/span><\/div><div class=\"tc-term-msg\"><span class=\"p\">&gt;<\/span>กรอกข้อมูลด้านบนแล้วกดปุ่มคำนวณ เพื่อเริ่มวิเคราะห์ขนาดหม้อแปลง<span class=\"tc-cursor\"><\/span><\/div><\/div><\/div><\/div><\/div><\/div><\/div>"}}, BAR_CSS=".pv-tabs{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:99999;display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(12,7,10,.92);border:1px solid #5a2f1c;box-shadow:0 8px 30px rgba(0,0,0,.5);font:500 .82rem Kanit,sans-serif}.pv-tabs button{font:inherit;color:#ffd0a8;background:transparent;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}.pv-tabs button[aria-current=true]{background:#ff7a1a;color:#1a0b06}.pv-toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99999;padding:10px 18px;border-radius:12px;background:#2a1710;color:#ffd0a8;border:1px solid #ff7a1a;font:500 .9rem Kanit,sans-serif}";
function initHome(){
        /* เอฟเฟกต์ตามเมาส์: แสงตามเคอร์เซอร์ + ไฟและการเอียงของการ์ด */
        (function () {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            var glow = document.createElement("div");
            glow.className = "cursor-glow";
            document.body.appendChild(glow);
            document.addEventListener("pointermove", function (event) {
                if (event.pointerType === "touch") return;
                glow.style.opacity = 1;
                glow.style.transform = "translate3d(" + event.clientX + "px," + event.clientY + "px,0)";
                var card = event.target.closest && event.target.closest(".card");
                if (!card) return;
                var box = card.getBoundingClientRect();
                var x = event.clientX - box.left, y = event.clientY - box.top;
                card.style.setProperty("--mx", x + "px");
                card.style.setProperty("--my", y + "px");
                card.style.setProperty("--spot", "1");
                card.style.setProperty("--ry", ((x / box.width - 0.5) * 8) + "deg");
                card.style.setProperty("--rx", ((0.5 - y / box.height) * 6) + "deg");
            });
            document.addEventListener("pointerout", function (event) {
                var card = event.target.closest && event.target.closest(".card");
                if (card && !card.contains(event.relatedTarget)) {
                    ["--spot", "--rx", "--ry"].forEach(function (name) { card.style.removeProperty(name); });
                }
            });
            document.documentElement.addEventListener("mouseleave", function () { glow.style.opacity = 0; });
        })();
    }

function initCurrent(){const $=i=>document.getElementById(i);const B=[6,10,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630];
function calc(){let P=+$('c-p').value||0;const kw=$('c-unit').value==='kW';if(kw)P*=1000;const t=$('c-ph').value==='3',V=+$('c-v').value,pf=+$('c-pf').value;$('c-pfv').textContent=pf.toFixed(2);
if(V<=0){$('c-out').innerHTML='<p>แรงดันไฟฟ้าต้องมากกว่า 0</p>';return}
const I=P>0?P/((t?Math.sqrt(3):1)*V*pf):0,S=P/(pf*1000),br=I>0?B.find(s=>s>=I*1.25):null;const f=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
$('c-out').innerHTML='<div class="ec-result"><div class="ec-result-label">กระแสไฟฟ้าโดยประมาณ</div><div class="ec-amp">'+f(I)+' <small>A</small></div><div class="ec-summary">'+f(+$('c-p').value||0)+' '+$('c-unit').value+' · '+V+' V · PF '+pf.toFixed(2)+' · '+(t?'3':'1')+' เฟส</div></div>'
+'<div class="ec-row"><span>กำลังจริง</span><b>'+f(P/1000)+' kW</b></div><div class="ec-row"><span>กำลังปรากฏ</span><b>'+f(S)+' kVA</b></div><div class="ec-row"><span>เบรกเกอร์แนะนำ (เผื่อ 25%)</span><b>'+(br?br+' A':I>0?'เกิน 630 A':'—')+'</b></div>'
+'<div class="ec-formula">'+(t?'I = P / (√3 × V × PF)':'I = P / (V × PF)')+'</div><div class="ec-disclaimer">ค่าที่ได้เป็นการประมาณเบื้องต้น ควรให้วิศวกรไฟฟ้าตรวจสอบก่อนนำไปใช้งานจริง</div>'}
$('c-ph').onchange=()=>{$('c-v').value=$('c-ph').value==='3'?380:220;calc()};['c-unit','c-p','c-v','c-pf'].forEach(i=>$(i).oninput=calc);calc()}


function initTransformer(){const $=i=>document.getElementById(i),S=[10, 15, 20, 25, 30, 40, 50, 63, 75, 100, 125, 160, 200, 250, 315, 400, 500, 630, 800, 1000, 1250, 1600, 2000, 2500];
function status(k,t){const e=document.querySelector('.tc-status');e.className='tc-status'+(k?' is-'+k:'');e.innerHTML='<i></i>'+t}
$('t-go').onclick=()=>{const kw=+$('t-kw').value,pf=Math.min(1,Math.max(.1,+$('t-pf').value||.8)),rs=+$('t-rs').value||0;
if(!(kw>0)){status('error','INPUT ERROR');$('t-out').innerHTML='<div class="warn">กรุณากรอกกำลังไฟฟ้ารวมมากกว่า 0 kW</div>';return}
const req=kw/pf*(1+rs/100),rec=S.find(s=>s>=req)||null,r2=Math.round(req*100)/100,ip=Math.floor(r2),dc=r2.toFixed(2).split('.')[1],util=rec?req/rec*100:0;
const f=(n,d)=>n.toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d});status('done','ANALYSIS COMPLETE');
const reqH=ip<1000?'<span class="tc-count" style="--tc-num:'+ip+'"></span>.'+dc:f(req,2);
const chips=S.map(s=>'<div class="tc-chip '+(rec&&s===rec?'is-pick':s<req?'is-low':'is-high')+'">'+s.toLocaleString('en')+'</div>').join('');
const rows=[['load_input',f(kw,2)+' kW'],['power_factor',pf.toFixed(2)],['reserve_margin',rs.toFixed(1)+' %'],['required_kva',f(req,2)+' kVA'],['selected_kva',rec?rec.toLocaleString('en')+' kVA':'out_of_range'],['utilization',rec?util.toFixed(1)+' %':'—']]
.map(x=>'<div><span class="p">&gt;</span><span class="k">'+x[0]+'</span><span class="v">'+x[1]+'</span></div>').join('');
const msg=rec?'วิเคราะห์เสร็จสิ้น: โหลด '+f(kw,2)+' kW · PF '+pf.toFixed(2)+' → ควรเลือกหม้อแปลง '+rec.toLocaleString('en')+' kVA (ใช้ประมาณ '+util.toFixed(1)+'% ของพิกัด)':'ค่าที่คำนวณได้เกินขนาดมาตรฐานสูงสุดในระบบ โปรดให้วิศวกรพิจารณา';
$('t-out').innerHTML='<div class="tc-card"><div class="tc-grid"><div class="tc-cell"><div class="tc-label">// REQUIRED CAPACITY</div><div class="tc-big tc-cyan">'+reqH+'<small>kVA</small></div><div class="tc-sub">ขนาดที่ต้องการโดยประมาณ</div></div>'
+'<div class="tc-cell"><div class="tc-label">// STANDARD SIZE</div><div class="tc-big tc-amber">'+(rec?rec.toLocaleString('en')+'<small>kVA</small>':'N/A')+'</div><div class="tc-sub">ขนาดหม้อแปลงมาตรฐานที่แนะนำ</div></div></div></div>'
+'<div class="tc-card"><div class="tc-label">// STANDARD SIZE MAP (kVA)</div><div class="tc-chips">'+chips+'</div><div class="tc-legend">จางขีดฆ่า = เล็กกว่าที่ต้องการ · เรืองแสง = ขนาดที่เลือก · ปกติ = ขนาดที่ใหญ่กว่า</div></div>'
+'<div class="tc-card"><div class="tc-term-bar"><b></b><b></b><b></b>AI ANALYSIS · transformer.sizing</div><div class="tc-term-body">'+rows+'<div class="tc-term-msg"><span class="p">&gt;</span>'+msg+'<span class="tc-cursor"></span></div></div></div>'
+'<div class="warn">เป็นค่าประมาณเบื้องต้น ต้องให้วิศวกรไฟฟ้าตรวจสอบก่อนใช้งานจริง</div>'};$('t-go').click()}

const INIT={home:initHome,current:initCurrent,transformer:initTransformer},LABEL={home:'หน้าแรก',current:'คำนวณกระแสไฟ',transformer:'คำนวณหม้อแปลง'};
function show(name){const p=PAGES[name];document.head.innerHTML='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>แบบร่างแอป</title>'+p.head;
document.body.innerHTML=p.body+'<style>'+BAR_CSS+'</style><div class="pv-tabs">'+Object.keys(LABEL).map(k=>'<button data-go="'+k+'" aria-current="'+(k===name)+'">'+LABEL[k]+'</button>').join('')+'</div>';
window.scrollTo(0,0);INIT[name]()}
function toast(t){const e=document.createElement('div');e.className='pv-toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-app-page]');if(!t)return;e.preventDefault();let g=t.dataset.go;
if(!g){g={current_calc:'current',transformer_calc:'transformer'}[t.dataset.appPage];if(!g){toast('หน้านี้ยังไม่อยู่ในแบบร่าง (ในแอปจริงเปิดได้)');return}}show(g)},true);
show('home');
</script></html>
